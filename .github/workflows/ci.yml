name: CI

# Push/tag builds: only Release (see release.yml). CI runs on PRs only.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Perl test deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libtest-simple-perl

      - name: Verify (syntax + critical tests)
        run: bash scripts/verify.sh
