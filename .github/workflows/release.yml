name: Release

# Build + GitHub Release only when a new version tag is pushed (v*).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Perl test deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libtest-simple-perl

      - name: Verify before release
        run: bash scripts/verify.sh

      - name: Build artifacts
        env:
          TAG: ${{ github.ref_name }}
          SKIP_TESTS: "1"
        run: bash scripts/build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "LinuxGSM-WebCore ${{ github.ref_name }}"
          body: |
            ## Installation

            ```bash
            sudo bash <(curl -sL https://github.com/knoellix/LinuxGSM-WebCore/releases/latest/download/install.sh)
            ```

            Voraussetzung: [Webmin](https://webmin.com/install/) muss installiert sein.
          files: |
            dist/linuxgsm-webcore-*.wbm
            dist/install.sh
